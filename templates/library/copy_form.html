{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ title }} | Apex Library{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-3">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="fw-bold mb-0 text-dark">{{ title }}</h5>
                    <div class="small text-muted">Book: {{ book.title }}</div>
                </div>
                <a href="{% url 'library:book_detail' book.id %}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Back to Book
                </a>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="mt-4 text-end">
                        <a href="{% url 'library:book_detail' book.id %}" class="btn btn-light border me-2">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">
                            Save Inventory Copy <i class="bi bi-check-lg ms-1"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
