apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: lms-route
  namespace: library-system
  labels:
    app: lms-web
    app.kubernetes.io/name: library-management-system
spec:
  to:
    kind: Service
    name: lms-service
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
