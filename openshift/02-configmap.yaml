apiVersion: v1
kind: ConfigMap
metadata:
  name: lms-config
  namespace: library-system
  labels:
    app.kubernetes.io/name: library-management-system
data:
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "*"
  DEFAULT_BORROW_DAYS: "14"
  FINE_PER_DAY: "1.00"
  MAX_BOOKS_BORROWED_STUDENT: "3"
  MAX_RESERVATIONS_STUDENT: "3"
  RESERVATION_EXPIRY_DAYS: "3"
  RUN_SEED: "True"
  POSTGRES_DB: "library_db"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
