apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lms-media-pvc
  namespace: library-system
  labels:
    app.kubernetes.io/name: library-management-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: library-system
  labels:
    app.kubernetes.io/name: library-management-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
